---
apiVersion: gateway.mulesoft.com/v1alpha1
kind: Extension
metadata:
  labels:
    title: EU AI Act Use-Case Risk Tagging
    category: Compliance
    description: >-
      Tags inbound LLM requests with an indicative EU AI Act use-case risk band
      (prohibited/high-risk/transparency/minimal) via a typed Jev judge, so
      risky uses are logged. A triage aid, not a legal determination;
      annotation-first, blocking opt-in.
    metadata/capabilities/injectionPoint: inbound
    metadata/capabilities/assetTypes: rest,http
    metadata/interfaceScope: api,resource
spec:
  extends:
    - name: extension-definition
      namespace: default
  properties:
    # ── Operating mode (jev-policy-common) ──────────────────────────────────
    mode:
      type: string
      enum: [enforce, shadow, off]
      default: shadow
      description: >-
        enforce sets the upstream risk header, raises a policy-violation event
        for prohibited/high-risk uses, and can deny (403). shadow (default for
        first deployment) computes and logs the tag but never mutates or denies.
        off passes through without calling the judge.
    failMode:
      type: string
      enum: [open, closed]
      default: open
      description: >-
        On a judge error or timeout, open passes the request through untagged
        (decision logged as unavailable); closed denies it with reason
        decision_unavailable.
    # ── Judge (jev-client) ──────────────────────────────────────────────────
    jevProvider:
      type: string
      enum: [mock, typesafe, openai, openrouter, litellm, cloudflare, custom]
      default: typesafe
      description: >-
        System-One judge provider. typesafe = TypeSafe Jev noul/choice API.
        openai/openrouter/litellm/custom = an OpenAI-compatible chat endpoint
        driven as a typed JSON judge. mock = deterministic in-policy judge for
        tests and offline demos (requires allowMock: true).
    jevService:
      type: string
      format: service
      description: >-
        Base URL of the judge provider (e.g. https://openrouter.ai or the
        TypeSafe System One host). Required even for mock (any reachable URL);
        the mock provider never calls it.
    jevPath:
      type: string
      description: >-
        Optional path override for the judge endpoint. Defaults per provider
        (e.g. /api/alpha/decisions for typesafe).
    jevApiKey:
      type: string
      description: API key / bearer token for the judge provider. Not needed for mock.
      "@context": { "@characteristics": [security:sensitive] }
    jevModel:
      type: string
      default: "~typesafe/jev-latest"
      description: >-
        Judge model id. Defaults to the latest TypeSafe Jev decisions model. For
        OpenAI-compatible providers set your chat model (e.g. openai/gpt-4o-mini).
        Ignored for cloudflare and mock.
    cloudflareAccountId:
      type: string
      description: Cloudflare account id (only when jevProvider is cloudflare).
    customAuthHeader:
      type: string
      default: "Authorization"
      description: Header carrying the credential when jevProvider is custom.
    jevTimeoutMs:
      type: integer
      default: 600
      minimum: 1
      description: Per-call judge timeout (ms). Jev is typically 70-500 ms end to end.
    maxStateTokens:
      type: integer
      default: 24000
      minimum: 256
      description: >-
        Approximate token budget (chars/4) for each state field (system prompt,
        user message) sent to the judge; longer text is truncated head+tail with
        a gateway marker.
    minConfidence:
      type: number
      default: 0.6
      minimum: 0
      maximum: 1
      description: >-
        Choice confidence below this is treated as uncertain (the tag becomes
        uncertain rather than a concrete risk band).
    # ── Header / logging conventions (jev-policy-common) ────────────────────
    stripClientJevHeaders:
      type: boolean
      default: true
      description: >-
        Strip the inbound risk header from the client request so a client cannot
        spoof a tag consumed by a later policy or the upstream.
    logStateSample:
      type: boolean
      default: false
      description: >-
        Log a short (truncated) sample of the system prompt at debug level. Off
        by default (prompts can contain personal data); the decision log
        otherwise records only the tag and outcome.
    sampleRate:
      type: number
      default: 0.1
      minimum: 0
      maximum: 1
      description: >-
        Fraction of eligible (client, system-prompt) pairs actually sent to the
        judge, chosen by a stable hash so the same pair decides consistently
        (1.0 = every request).
    allowMock:
      type: boolean
      default: false
      description: Permit jevProvider = mock. Guard so mock is never used unintentionally in production.
    # ── Traffic scope ────────────────────────────────────────────────────────
    routes:
      type: array
      items:
        type: string
      default: []
      description: >-
        Optional path-prefix allowlist of inbound LLM routes to tag. Empty
        (default) tags every matched request. Prefixes match on segment boundaries.
    # ── Decision (C3-specific) ────────────────────────────────────────────────
    onProhibited:
      type: string
      enum: [flag, block]
      default: flag
      description: >-
        Action when the use case is classified prohibited_practice with
        confidence >= 0.8. flag tags + raises a violation event; block also
        denies with HTTP 403 (enforce mode only).
    onHighRisk:
      type: string
      enum: [flag, require_registration]
      default: flag
      description: >-
        Action when the use case is high_risk or the output supports a decision
        about a specific person. flag tags + raises a violation event.
        require_registration additionally denies (403) unless the request
        carries a useCaseHeader value present in registeredUseCases.
    registeredUseCases:
      type: array
      items:
        type: string
      default: []
      description: >-
        Allowlist of registered use-case ids. With onHighRisk =
        require_registration, a high-risk request is permitted only if its
        useCaseHeader value is in this list.
    useCaseHeader:
      type: string
      default: "x-ai-use-case-id"
      description: Request header carrying the declared use-case id checked against registeredUseCases.
    riskHeader:
      type: string
      default: "x-jev-ai-act-risk"
      description: Upstream request header set to the risk tag (also stripped from the inbound client request).
    clientIdHeader:
      type: string
      default: "x-client-id"
      description: >-
        Request header identifying the caller, combined with the system-prompt
        hash to form the deterministic sampling / cache key.
    prohibitedConfidence:
      type: number
      default: 0.8
      minimum: 0
      maximum: 1
      description: Confidence at or above which a prohibited_practice choice triggers the onProhibited action.
    affectsIndividualThreshold:
      type: number
      default: 0.7
      minimum: 0
      maximum: 1
      description: >-
        noul probability at or above which "the output supports a decision about
        a specific person" triggers the high-risk branch.
    cacheTtlSeconds:
      type: integer
      default: 86400
      minimum: 0
      description: >-
        Advisory cache lifetime (seconds) for a (client, system-prompt hash)
        decision. Reserved for the cross-request dedup cache (a documented Data
        Storage enhancement); sampling is otherwise deterministic per pair.
    # ── Question pack overrides (legal-editable criteria text) ─────────────────
    prohibitedCriteria:
      type: string
      description: Override the prohibited_practice criteria text sent to the judge (versioned question pack).
    highRiskCriteria:
      type: string
      description: Override the high_risk criteria text sent to the judge.
    transparencyCriteria:
      type: string
      description: Override the transparency_obligation criteria text sent to the judge.
    minimalCriteria:
      type: string
      description: Override the minimal_risk criteria text sent to the judge.
  required:
    - jevService
