[package]
name = "eu_ai_act_risk_tagging"
version = "1.0.0"
rust-version = "1.88.0"
edition = "2018"
resolver = "2"

[package.metadata.anypoint]
group_id = "030e0aac-30d9-460f-9234-428c16a123c4"
definition_asset_id = { name = "eu-ai-act-risk-tagging", version = "1.0.0" }
implementation_asset_id = "eu-ai-act-risk-tagging-flex"

[dependencies]
# enable_stop_iteration: this request-leg policy buffers the request headers AND body
# together (into_headers_body_state) so it can read the LLM system prompt + user
# message, call the judge, and only then set the x-jev-ai-act-risk upstream header
# (or deny) before anything is forwarded upstream. That hold requires stop-iteration.
pdk = { version = "1.10.0", features = ["enable_stop_iteration"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow = "1.0"

[dev-dependencies]
pdk-test = { version = "1.10.0" }
httpmock = "0.6"
reqwest = "0.11"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
opt-level = 'z'
strip = "debuginfo"
